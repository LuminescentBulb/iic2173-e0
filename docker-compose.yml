services:
  master:
    build: ./master
    ports: 
      - "8080:8080"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 10s
    depends_on:
      db:
        condition: service_healthy
  
  connector:
    build: ./connector
    environment:
      - MASTER_URL=http://master:8080
      - RABBITMQ_URL=${RABBITMQ_URL}
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/connector_ready"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 10s
    depends_on:
      master:
        condition: service_healthy

  db:
    image: postgres:17
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 10s
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:

